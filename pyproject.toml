[project]
name = "pylab10-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "notebook>=7.5.6",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.29",
    "scikit-learn>=1.8.0",
    "uvicorn>=0.47.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 110
extend-exclude = ["*.ipynb", ".venv", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
